name: backtoschool
services:
  backend-app:
    build: .
    container_name: course-backend-app
    depends_on:
      - db
    ports:
      - 8080:8080
    environment:
      - spring.datasource.url=jdbc:mysql://db:3306/course_db

  db:
    image: mysql
    container_name: course_db
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: user
      MYSQL_PASSWORD: user1234
      MYSQL_DATABASE: course_db