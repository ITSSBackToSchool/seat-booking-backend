spring:
  application:
    name: course
  datasource:
    url: jdbc:mysql://localhost:3307/seat_booking_db?createDatabaseIfNotExist=true
    username: user
    password: user1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

server:
  port: 8090

azure:
  maps:
    subscription-key: ${AZURE_MAPS_KEY:your-azure-maps-subscription-key-here}
    base-url: https://atlas.microsoft.com
    api-version: 2024-04-01

company:
  headquarters:
    latitude: 35.6762
    longitude: 139.6503
    address: "Bucharest, Romania"
