spring:
  application:
    name: course_db
  datasource:
    url: jdbc:mysql://localhost:3307/course_db?createDatabaseIfNotExist=true
    username: user
    password: user1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

