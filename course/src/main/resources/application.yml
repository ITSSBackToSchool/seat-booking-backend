spring:
  application:
    name: course
  datasource:
    url: jdbc:mysql://localhost:3307/seat_booking_db?createDatabaseIfNotExist=true
    username: user
    password: user1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

server:
  port: 8080

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
jwt:
  secret: ${JWT_SECRET:supersecretkeysupersecretkeysupersecretkey123456789012345678901234567890}
  expiration: 86400000
