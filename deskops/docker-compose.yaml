name: deskops-stack
services:
  backend-app:
    build: .
    container_name: deskops-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8080:8080
    environment:
      - spring.datasource.url=jdbc:mysql://db:3306/deskops_db
      - WEATHER_API_KEY=${WEATHER_API_KEY:-demo_key}
      - TRAFFIC_API_KEY=${TRAFFIC_API_KEY:-demo_key}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN:-deskops.eu.auth0.com}
      - AUTH0_MGMT_CLIENT_ID=${AUTH0_MGMT_CLIENT_ID}
      - AUTH0_MGMT_CLIENT_SECRET=${AUTH0_MGMT_CLIENT_SECRET}
      - AUTH0_EMPLOYEE_ROLE_ID=${AUTH0_EMPLOYEE_ROLE_ID}
      - AUTH0_HR_ROLE_ID=${AUTH0_HR_ROLE_ID}
      - AUTH0_ADMIN_ROLE_ID=${AUTH0_ADMIN_ROLE_ID}
    restart: on-failure

  db:
    image: mysql
    container_name: deskops-db
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: user
      MYSQL_PASSWORD: user1234
      MYSQL_DATABASE: deskops_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user", "-puser1234"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s