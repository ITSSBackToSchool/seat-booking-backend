spring:
  application:
    name: deskops
  datasource:
    url: jdbc:mysql://localhost:3306/deskops_db?createDatabaseIfNotExist=true
    username: user
    password: user1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://deskops.eu.auth0.com/
          audiences: https://api.deskops.com

server:
  port: 8080

weather:
  provider: openweathermap
  api-key: ${WEATHER_API_KEY:demo_key}
  base-url: https://api.openweathermap.org/data/2.5
  timeout-seconds: 5
  cache:
    current-ttl-minutes: 120
    forecast-ttl-minutes: 360
  default-location:
    city: Bucharest
    latitude: 44.4268
    longitude: 26.1025
