name: seat-booking-containers-stack
services:
  backend-app:
    build: .
    container_name: seat-booking-backend-app
    depends_on:
      - db
    ports:
      - 8080:8080
    environment:
      - spring.datasource.url=jdbc:mysql://db:3307/seat_booking_db

  db:
    image: mysql
    container_name: seat-booking-db
    ports:
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: user
      MYSQL_PASSWORD: user1234
      MYSQL_DATABASE: seat_booking_db